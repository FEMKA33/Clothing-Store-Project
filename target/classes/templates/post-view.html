<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title th:text="${post.title}">Post</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body class="container mt-4">
<a href="/feed" class="btn btn-link">← Назад</a>
<h1 th:text="${post.title}"></h1>
<p th:text="${post.content}"></p>
<hr/>
<h4>Комментарии</h4>

<ul id="comments" class="list-group mb-3">
    <li th:each="c : ${comments}" class="list-group-item">
        <strong th:text="${c.author?.username}">user</strong>
        <small class="text-muted" th:text="${#temporals.format(c.createdAt, 'HH:mm dd.MM.yyyy')}">time</small>
        <div th:text="${c.text}">text</div>
    </li>
</ul>

<div th:if="${username != null}">
    <div class="mb-2">
        <textarea id="commentText" class="form-control" placeholder="Написать комментарий"></textarea>
    </div>
    <button id="sendBtn" class="btn btn-primary">Отправить</button>
</div>
<div th:if="${username == null}">
    <a href="/login">Войдите</a>, чтобы оставить комментарий.
</div>

<script>
    const postId = /*[[${post.id}]]*/ '0';
    const username = /*[[${username != null ? username : ''}]]*/ '';

    document.getElementById('sendBtn')?.addEventListener('click', async () => {
        const text = document.getElementById('commentText').value.trim();
        if (!text) return;
        const res = await fetch('/api/posts/' + postId + '/comments', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({text})
        });
        document.getElementById('commentText').value = '';
    });

    let stompClient;
    function connectWs() {
        const socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, function () {
            stompClient.subscribe('/topic/posts/' + postId + '/comments', function (msg) {
                const comment = JSON.parse(msg.body);
                appendComment(comment);
            });
        });
    }

    function appendComment(c) {
        const ul = document.getElementById('comments');
        const li = document.createElement('li');
        li.className = 'list-group-item';
        li.innerHTML = `<strong>${c.author ? c.author.username : 'anon'}</strong>
                    <small class="text-muted">${new Date(c.createdAt).toLocaleString()}</small>
                    <div>${c.text}</div>`;
        ul.appendChild(li);
    }

    connectWs();
</script>
</body>
</html>
