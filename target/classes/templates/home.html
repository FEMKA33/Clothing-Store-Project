<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content">

    <h2>
        Добро пожаловать в YOStore
        <span th:text="': ' + ${username}"></span>
    </h2>

    <section class="home-section">
        <h3>🔥 Популярное</h3>

        <div class="products-grid">
            <div class="product-card" th:each="p : ${popular}">

                <!-- ❤️ Избранное -->
                <button class="favorite-btn"
                        th:classappend="${p.inFavorites} ? ' active'"
                        th:data-product-id="${p.id}"
                        title="В избранное">
                    ♥
                </button>

                <img class="media"
                     th:src="${p.imageUrl}"
                     th:alt="${p.title}" />

                <div class="body">
                    <h3 th:text="${p.title}"></h3>
                    <div class="brand" th:text="${p.brand}"></div>
                    <span class="price"
                          th:text="${#numbers.formatDecimal(p.price, 2, 2, 'COMMA')}"></span>
                </div>
            </div>
        </div>
    </section>

    <!-- ================= Акции ================= -->
    <section class="home-section">
        <h3>💸 Акции</h3>

        <div class="products-grid">
            <div class="product-card" th:each="p : ${discounts}">

                <span class="badge sale">Sale</span>

                <!-- ❤️ Избранное -->
                <button class="favorite-btn"
                        th:classappend="${p.inFavorites} ? ' active'"
                        th:data-product-id="${p.id}"
                        title="В избранное">
                    ♥
                </button>

                <img class="media"
                     th:src="${p.imageUrl}"
                     th:alt="${p.title}" />

                <div class="body">
                    <h3 th:text="${p.title}"></h3>

                    <div class="prices">
                        <span class="old-price"
                              th:text="${#numbers.formatDecimal(p.oldPrice, 2, 2, 'COMMA')}"></span>
                        <span class="price"
                              th:text="${#numbers.formatDecimal(p.price, 2, 2, 'COMMA')}"></span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="home-section">
        <h3>🎲 Рекомендуем</h3>

        <div class="products-grid">
            <div class="product-card" th:each="p : ${random}">

                <button class="favorite-btn"
                        th:classappend="${p.inFavorites} ? ' active'"
                        th:data-product-id="${p.id}"
                        title="В избранное">
                    ♥
                </button>

                <img class="media"
                     th:src="${p.imageUrl}"
                     th:alt="${p.title}" />

                <div class="body">
                    <h3 th:text="${p.title}"></h3>
                    <span class="price"
                          th:text="${#numbers.formatDecimal(p.price, 2, 2, 'COMMA')}"></span>
                </div>
            </div>
        </div>
    </section>

</div>

</body>
</html>
