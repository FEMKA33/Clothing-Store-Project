<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">

    <h2>Редактировать товар</h2>

    <form method="post" th:action="@{/admin/edit}" th:object="${product}" class="form">

        <input type="hidden" th:field="*{id}"/>

        <label>Название</label>
        <input type="text" th:field="*{title}" required>

        <label>Бренд</label>
        <input type="text" th:field="*{brand}" required>

        <label>Цена</label>
        <input type="number" th:field="*{price}" step="0.01" required>

        <label>URL изображения</label>
        <input type="text" th:field="*{imageUrl}" required>

        <label>Описание</label>
        <textarea th:field="*{description}"></textarea>

        <label>
            <input type="checkbox" th:field="*{discount}">
            Есть скидка
        </label>

        <label>Старая цена</label>
        <input type="number" th:field="*{oldPrice}" step="0.01">

        <button class="btn primary" type="submit">Сохранить</button>
    </form>

</div>
</body>
</html>
