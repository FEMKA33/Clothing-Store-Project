<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Feed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">
<div class="d-flex justify-content-between align-items-center">
    <h1>Форум</h1>
    <a class="btn btn-primary" th:href="@{/posts/new}">Создать тему</a>
</div>

<div class="list-group mt-3">
    <a th:each="p : ${posts}" th:href="@{/posts/{id}(id=${p.id})}"
       class="list-group-item list-group-item-action">
        <div class="d-flex w-100 justify-content-between">
            <h5 th:text="${p.title}">Title</h5>
            <small th:text="${#temporals.format(p.createdAt, 'yyyy-MM-dd HH:mm')}">date</small>
        </div>
        <p th:text="${p.content}">content</p>
        <small>Автор: <span th:text="${p.author?.username}">user</span></small>
    </a>
</div>
</body>
</html>
